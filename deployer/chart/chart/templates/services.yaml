{{- /* KMS Service */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cw-wallet-kms
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubewire.labels" . | nindent 4 }}
    app: cw-wallet-kms
spec:
  replicas: {{ .Values.kms.replicas }}
  selector:
    matchLabels:
      app: cw-wallet-kms
  template:
    metadata:
      labels:
        app: cw-wallet-kms
        {{- include "cubewire.podLabels" . | nindent 8 }}
    spec:
      containers:
        - name: cw-wallet-kms
          image: "{{ .Values.kms.image.repository }}:{{ .Values.kms.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "{{ .Values.kms.port }}"
          ports:
            - containerPort: {{ .Values.kms.port }}
          resources:
            {{- toYaml .Values.kms.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cw-wallet-kms
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubewire.labels" . | nindent 4 }}
spec:
  selector:
    app: cw-wallet-kms
  ports:
    - port: {{ .Values.kms.port }}
      targetPort: {{ .Values.kms.port }}
---
{{- /* Transactions Service */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cw-wallet-transactions
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubewire.labels" . | nindent 4 }}
    app: cw-wallet-transactions
spec:
  replicas: {{ .Values.transactions.replicas }}
  selector:
    matchLabels:
      app: cw-wallet-transactions
  template:
    metadata:
      labels:
        app: cw-wallet-transactions
        {{- include "cubewire.podLabels" . | nindent 8 }}
    spec:
      containers:
        - name: cw-wallet-transactions
          image: "{{ .Values.transactions.image.repository }}:{{ .Values.transactions.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "{{ .Values.transactions.port }}"
          ports:
            - containerPort: {{ .Values.transactions.port }}
          resources:
            {{- toYaml .Values.transactions.resources | nindent 12 }}
        {{- if .Values.cloudSql.connectionName }}
        {{- include "cubewire.cloudSqlProxy" . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cw-wallet-transactions
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubewire.labels" . | nindent 4 }}
spec:
  selector:
    app: cw-wallet-transactions
  ports:
    - port: {{ .Values.transactions.port }}
      targetPort: {{ .Values.transactions.port }}
---
