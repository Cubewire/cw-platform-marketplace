apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id": "cubewire", "product_id": "cubewire-platform", "partner_name": "Cubewire"}'
spec:
  descriptor:
    type: CubewirePlatform
    version: "1.0.0"
    description: >-
      Cubewire Platform - Enterprise-grade Web3 infrastructure for
      secure, scalable payment and digital asset applications.
    maintainers:
      - name: Cubewire
        url: https://www.cubewire.com
    links:
      - description: Website
        url: https://www.cubewire.com
      - description: Documentation
        url: https://docs.cubewire.com
      - description: Trust Center
        url: https://trust.p8.io
    notes: |-
      # Cubewire Platform

      Cubewire has been deployed to your cluster.

      ## Access the Webapp
      {{- if .Values.webapp.domain }}
      Visit: https://{{ .Values.webapp.domain }}
      {{- else }}
      Run: kubectl get svc -n {{ .Release.Namespace }} cw-wallet-webapp
      {{- end }}

      ## Documentation
      https://docs.cubewire.com
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  componentKinds:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
